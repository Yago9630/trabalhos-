<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:disabled {
            background-color: #e9ecef;
        }

        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Consulta de CEP</h2>
        
        <div class="form-group">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" maxlength="9" onblur="buscarEndereco()">
            <span id="erro-cep" class="error">CEP não encontrado ou inválido.</span>
        </div>

        <div class="form-group">
            <label for="logradouro">Rua / Logradouro:</label>
            <input type="text" id="logradouro" disabled>
        </div>

        <div class="form-group">
            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" disabled>
        </div>

        <div class="form-group">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" disabled>
        </div>

        <div class="form-group">
            <label for="uf">Estado (UF):</label>
            <input type="text" id="uf" disabled>
        </div>
    </div>

    <script>
        async function buscarEndereco() {
            const cepInput = document.getElementById('cep');
            const erroCep = document.getElementById('erro-cep');
            
            // Remove qualquer caractere que não seja número
            const cep = cepInput.value.replace(/\D/g, '');

            // Esconde mensagem de erro inicial
            erroCep.style.display = 'none';

            // Valida se possui 8 dígitos
            if (cep.length !== 8) {
                if (cep.length > 0) {
                    erroCep.textContent = 'Digite um CEP válido com 8 dígitos.';
                    erroCep.style.display = 'block';
                }
                limparFormulario();
                return;
            }

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (data.erro) {
                    erroCep.textContent = 'CEP não encontrado.';
                    erroCep.style.display = 'block';
                    limparFormulario();
                } else {
                    document.getElementById('logradouro').value = data.logradouro;
                    document.getElementById('bairro').value = data.bairro;
                    document.getElementById('cidade').value = data.localidade;
                    document.getElementById('uf').value = data.uf;
                }
            } catch (error) {
                erroCep.textContent = 'Erro ao consultar o CEP.';
                erroCep.style.display = 'block';
                limparFormulario();
            }
        }

        function limparFormulario() {
            document.getElementById('logradouro').value = '';
            document.getElementById('bairro').value = '';
            document.getElementById('cidade').value = '';
            document.getElementById('uf').value = '';
        }
    </script>

</body>
</html>
